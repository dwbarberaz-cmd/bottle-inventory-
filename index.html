<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1769c2"><link rel="manifest" href="manifest.webmanifest">
<title>Bottle Inventory</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f6f8;color:#17202a}
header{background:#1769c2;color:#fff;padding:20px}header h1{margin:0}
main{max-width:800px;margin:auto;padding:14px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}
input,select{width:100%;padding:13px;border:1px solid #ccd2d8;border-radius:12px;font-size:16px;background:#fff}
button{border:0;border-radius:13px;padding:13px 17px;font-weight:700;font-size:16px}
.primary{background:#e5eefb;color:#1255a0}.danger{background:#fde8eb;color:#a51f36}.dark{background:#17202a;color:#fff}
.big{font-size:44px;font-weight:800}.muted{color:#68727d}.item{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-top:1px solid #eee}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:42px;height:42px;padding:0;border-radius:50%}
.group-title{margin:22px 0 4px;font-size:20px;color:#1769c2}.badge{display:inline-block;background:#eef3f8;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:700;margin-bottom:5px}
video{width:100%;border-radius:15px;background:#000;margin-top:12px}dialog{border:0;border-radius:20px;width:min(92%,500px);padding:20px}
label{display:block;font-weight:700;margin:10px 0 5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}
</style></head><body>
<header><h1>🍾 Bottle Inventory</h1><div>Scan • Count • Track</div></header>
<main>
<section class="card"><div class="row"><div style="flex:1"><div class="muted">Total bottles</div><div class="big" id="total">0</div></div><button class="primary" id="scan">📷 Scan</button></div>
<div id="status" class="muted">Ready to scan.</div><video id="video" playsinline class="hidden"></video><button id="stop" class="dark hidden" style="margin-top:10px">Stop camera</button></section>

<section class="card"><div class="row"><input id="search" placeholder="Search inventory..."><button class="danger" id="clear">Clear</button></div>
<div style="margin-top:10px"><label style="margin-top:0">Show type</label><select id="typeFilter"><option value="">All types</option></select></div></section>

<section class="card"><h2>Inventory — arranged by type</h2><div id="list"></div><div id="empty" class="muted">No bottles yet. Tap Scan to start.</div></section>

<section class="card"><h2>Backup</h2><button class="dark" id="export">Export CSV</button> <button class="primary" id="import">Import CSV</button>
<input type="file" id="file" accept=".csv" class="hidden"></section>
</main>

<dialog id="dlg"><h2>Bottle details</h2>
<label>Product name</label><input id="name" placeholder="e.g. Jack Daniel's">
<label>Type of alcohol</label><select id="type">
<option value="">Select a type</option><option>Whiskey</option><option>Bourbon</option><option>Scotch</option><option>Vodka</option><option>Gin</option><option>Rum</option><option>Tequila</option><option>Mezcal</option><option>Brandy</option><option>Cognac</option><option>Liqueur</option><option>Wine</option><option>Beer</option><option>Other</option>
</select>
<label>Size</label><input id="size" placeholder="e.g. 750 mL">
<label>Cost per bottle</label><input id="cost" type="number" step="0.01">
<label>Notes</label><input id="notes" placeholder="Shelf or other notes">
<div class="actions"><button class="dark" id="save">Save</button><button class="danger" id="cancel">Cancel</button></div></dialog>

<script>
const KEY='bottleInventoryV4';
let inv=JSON.parse(localStorage.getItem(KEY)||'{}'),stream=null,current='';
const TYPES=['Whiskey','Bourbon','Scotch','Vodka','Gin','Rum','Tequila','Mezcal','Brandy','Cognac','Liqueur','Wine','Beer','Other'];
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(inv));render()}
function setupFilter(){
  const f=$('typeFilter'), old=f.value;
  f.innerHTML='<option value="">All types</option>'+TYPES.map(t=>`<option>${esc(t)}</option>`).join('');
  const custom=[...new Set(Object.values(inv).map(x=>x.type).filter(t=>t&&!TYPES.includes(t)))].sort();
  f.innerHTML+=custom.map(t=>`<option>${esc(t)}</option>`).join('');
  f.value=old;
}
function render(){
  setupFilter();
  let q=$('search').value.toLowerCase(), filter=$('typeFilter').value;
  let a=Object.values(inv).filter(x=>{
    const hay=(x.name+' '+x.barcode+' '+x.size+' '+x.notes+' '+x.type).toLowerCase();
    return hay.includes(q)&&(!filter||x.type===filter);
  });
  $('total').textContent=Object.values(inv).reduce((n,x)=>n+(Number(x.qty)||0),0);
  a.sort((x,y)=>(x.type||'Other').localeCompare(y.type||'Other')||(x.name||'').localeCompare(y.name||'')||x.barcode.localeCompare(y.barcode));
  const groups={};
  a.forEach(x=>{const t=x.type||'Uncategorized';(groups[t]??=[]).push(x)});
  $('list').innerHTML=Object.entries(groups).map(([type,items])=>`
    <div class="group-title">${esc(type)} <span class="muted">(${items.reduce((n,x)=>n+(Number(x.qty)||0),0)})</span></div>
    ${items.map(x=>`<div class="item"><div style="flex:1">
      <span class="badge">${esc(x.type||'Uncategorized')}</span><br>
      <b>${esc(x.name||'Bottle '+x.barcode)}</b>
      <div class="muted">${esc(x.size||'Size not entered')} • ${esc(x.barcode)}</div>
      ${x.cost?`<div class="muted">$${Number(x.cost).toFixed(2)} each</div>`:''}
      ${x.notes?`<div class="muted">${esc(x.notes)}</div>`:''}
      <button class="primary" onclick="edit('${esc(x.barcode)}')">Edit</button>
    </div><div class="qty"><button class="primary" onclick="chg('${esc(x.barcode)}',-1)">−</button><b>${x.qty}</b><button class="primary" onclick="chg('${esc(x.barcode)}',1)">+</button></div></div>`).join('')}
  `).join('');
  $('empty').classList.toggle('hidden',a.length>0);
}
window.chg=(c,n)=>{if(!inv[c])return;inv[c].qty+=n;if(inv[c].qty<=0)delete inv[c];save()};
window.edit=c=>{current=c;let x=inv[c];$('name').value=x.name||'';$('type').value=x.type||'';$('size').value=x.size||'';$('cost').value=x.cost||'';$('notes').value=x.notes||'';$('dlg').showModal()};
function details(c){current=c;let x=inv[c];$('name').value=x.name||'';$('type').value=x.type||'';$('size').value=x.size||'';$('cost').value=x.cost||'';$('notes').value=x.notes||'';$('dlg').showModal()}
$('save').onclick=()=>{let x=inv[current];x.name=$('name').value.trim();x.type=$('type').value;x.size=$('size').value.trim();x.cost=$('cost').value.trim();x.notes=$('notes').value.trim();save();$('dlg').close()};
$('cancel').onclick=()=>$('dlg').close();$('search').oninput=render;$('typeFilter').onchange=render;
$('clear').onclick=()=>{if(confirm('Delete all inventory on this phone?')){inv={};save()}};
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').classList.add('hidden');$('stop').classList.add('hidden');$('scan').classList.remove('hidden')}
$('stop').onclick=stop;
$('scan').onclick=async()=>{
 if(!('BarcodeDetector'in window)){alert('Barcode scanning is not supported by this browser. Use Chrome on Android.');return}
 try{
  let d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  $('video').srcObject=stream;await $('video').play();$('video').classList.remove('hidden');$('stop').classList.remove('hidden');$('scan').classList.add('hidden');$('status').textContent='Point camera at barcode.';
  async function loop(){if(!stream)return;let z=await d.detect($('video')).catch(()=>[]);
   if(z.length){let c=z[0].rawValue;
    if(!inv[c]){inv[c]={barcode:c,qty:1,name:'',type:'',size:'',cost:'',notes:''};current=c;save();stop();details(c)}
    else{inv[c].qty++;save();stop();$('status').textContent='Added another bottle: '+c}
   }else requestAnimationFrame(loop)
  }loop()
 }catch(e){$('status').textContent='Camera could not start. Check camera permission.'}
};
$('export').onclick=()=>{
 let s='barcode,name,type,size,quantity,cost,notes\n';
 Object.values(inv).forEach(x=>s+=[x.barcode,x.name,x.type,x.size,x.qty,x.cost,x.notes].map(v=>`"${String(v||'').replaceAll('"','""')}"`).join(',')+'\n');
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='bottle-inventory.csv';a.click()
};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 let t=await e.target.files[0].text();
 t.split(/\r?\n/).slice(1).forEach(l=>{
   let p=l.match(/"([^"]*)"/g)?.map(v=>v.slice(1,-1).replaceAll('""','"'));
   if(p?.length>=4)inv[p[0]]={barcode:p[0],name:p[1],type:p[2]||'',size:p[3]||'',qty:+p[4]||1,cost:p[5]||'',notes:p[6]||''}
 });
 save()
};
render();
</script></body></html>
